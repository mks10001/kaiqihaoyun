<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开启你的好运</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-6xl mx-auto p-4">
    <header class="mb-6">
      <h1 class="text-4xl font-bold">开启你的好运</h1>
      <p class="mt-2 text-slate-600">点击抽奖，有机会免费免单或低价购买。</p>
      <button id="adminOpen" class="mt-4 px-4 py-2 bg-slate-900 text-white rounded">管理后台</button>
    </header>

    <main class="grid gap-6 lg:grid-cols-3">
      <section class="lg:col-span-2 space-y-4">
        <article class="p-6 bg-white rounded shadow">
          <h2 id="productTitle" class="text-2xl font-semibold"></h2>
          <p id="productDescription" class="mt-2 text-slate-600"></p>
          <button id="drawButton" class="mt-6 px-6 py-3 bg-emerald-500 text-white rounded">点击抽奖</button>
        </article>
        <article id="contactForm" class="p-6 bg-white rounded shadow hidden">
          <h3 class="text-xl font-semibold">填写收货信息</h3>
          <ul id="formErrors" class="mt-3 text-sm text-red-600 hidden"></ul>
          <form class="space-y-4">
            <div>
              <label class="block text-sm font-medium">姓名</label>
              <input id="nameInput" class="mt-1 w-full border rounded px-3 py-2" />
            </div>
            <div>
              <label class="block text-sm font-medium">手机号</label>
              <input id="phoneInput" class="mt-1 w-full border rounded px-3 py-2" />
            </div>
            <div>
              <label class="block text-sm font-medium">详细地址</label>
              <textarea id="addressInput" class="mt-1 w-full border rounded px-3 py-2"></textarea>
            </div>
            <button id="submitContact" type="submit" class="px-5 py-3 bg-slate-900 text-white rounded">提交</button>
          </form>
        </article>
        <article id="resultModal" class="p-6 bg-white rounded shadow hidden">
          <h3 id="resultTitle" class="text-2xl font-semibold"></h3>
          <p id="resultDescription" class="mt-2"></p>
          <div class="mt-4 p-4 bg-slate-100 rounded">
            <p class="text-xl font-bold">号码：<span id="resultNumber"></span></p>
            <p class="mt-2">标签：<span id="resultBadge"></span></p>
          </div>
          <div id="paymentSection" class="mt-4 hidden">
            <p id="paymentQrcodeText" class="text-slate-700"></p>
          </div>
          <div class="mt-4">
            <p id="wechatQrcodeText" class="text-slate-700"></p>
          </div>
        </article>
      </section>
      <aside class="space-y-4">
        <article class="p-6 bg-white rounded shadow">
          <h3 class="text-xl font-semibold">中奖播报</h3>
          <div class="mt-4 text-slate-600">即将展示最近中奖名单</div>
        </article>
        <article class="p-6 bg-white rounded shadow">
          <h3 class="text-xl font-semibold">留言板</h3>
          <textarea id="messageInput" class="mt-3 w-full border rounded px-3 py-2" placeholder="留下你的商品建议"></textarea>
          <button id="messageSubmit" class="mt-3 px-4 py-2 bg-slate-900 text-white rounded">提交留言</button>
          <div id="messageList" class="mt-4 space-y-2 text-sm text-slate-700"></div>
        </article>
      </aside>
    </main>

    <footer class="mt-10 p-6 bg-white rounded shadow text-slate-600">
      <div class="mb-2">底部发货跑马灯：最新发货状态将在此处滚动展示。</div>
    </footer>
  </div>

  <div id="paymentModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center">
    <div class="bg-white p-6 rounded shadow w-full max-w-md">
      <p id="lockWarning" class="text-red-600"></p>
      <p>请先完成未付款订单。</p>
    </div>
  </div>

  <div id="adminModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center">
    <div class="bg-white p-6 rounded shadow w-full max-w-2xl">
      <div id="adminLoginForm" class="space-y-4">
        <h2 class="text-2xl font-semibold">后台登录</h2>
        <input id="adminPasswordInput" type="password" placeholder="密码" class="w-full border rounded px-3 py-2" />
        <p id="adminLoginError" class="text-red-600 hidden"></p>
        <button type="submit" class="px-4 py-2 bg-slate-900 text-white rounded">登录</button>
      </div>
      <div class="mt-6">
        <div class="grid gap-4 lg:grid-cols-2">
          <div>
            <h3 class="font-semibold">系统配置</h3>
            <input id="configTitle" class="mt-2 w-full border rounded px-3 py-2" placeholder="活动标题" />
            <input id="configDescription" class="mt-2 w-full border rounded px-3 py-2" placeholder="活动描述" />
            <button id="configSave" class="mt-3 px-4 py-2 bg-emerald-500 text-white rounded">保存配置</button>
          </div>
          <div id="orderSection">
            <h3 class="font-semibold">订单管理</h3>
            <table id="ordersTable" class="w-full text-left mt-2"><tbody></tbody></table>
          </div>
          <div id="messageSection" class="lg:col-span-2">
            <h3 class="font-semibold">留言管理</h3>
            <table id="messagesTable" class="w-full text-left mt-2"><tbody></tbody></table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="src/lottery.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/admin.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const storage = window.Storage;
      const config = storage.loadConfig(window.localStorage);
      const deps = {
        storage: {
          loadConfig: () => storage.loadConfig(window.localStorage),
          saveConfig: (cfg) => storage.saveConfig(window.localStorage, cfg),
          loadOrders: () => storage.loadOrders(window.localStorage),
          saveOrders: (orders) => storage.saveOrders(window.localStorage, orders),
          loadMessages: () => storage.loadMessages(window.localStorage),
          saveMessages: (messages) => storage.saveMessages(window.localStorage, messages),
          isUserLocked: (userId) => storage.isUserLocked(window.localStorage, userId),
          setUserLock: (userId) => storage.setUserLock(window.localStorage, userId),
          clearUserLock: (userId) => storage.clearUserLock(window.localStorage, userId),
        },
        lottery: window.Lottery,
        config,
        userId: 'visitor-' + Math.random().toString(36).slice(2, 8),
        onConfigSaved: function (cfg) {
          window.location.reload();
        },
      };
      window.UI.initializeApp(document, deps);
      window.Admin.initializeAdmin(document, deps);

      const messageInput = document.querySelector('#messageInput');
      const messageList = document.querySelector('#messageList');
      const messageSubmit = document.querySelector('#messageSubmit');

      function renderMessages() {
        const messages = storage.loadMessages(window.localStorage);
        messageList.innerHTML = messages.map((item) => `<div class="p-3 bg-slate-100 rounded">${item.text}</div>`).join('');
      }

      messageSubmit.addEventListener('click', function () {
        const text = messageInput.value.trim();
        if (!text) return;
        const messages = storage.loadMessages(window.localStorage);
        messages.push({ id: Date.now().toString(), text: text });
        storage.saveMessages(window.localStorage, messages);
        renderMessages();
        messageInput.value = '';
      });

      renderMessages();
    });
  </script>
</body>
</html>
